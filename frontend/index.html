<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XakuMedia — Local-First Windows Desktop Bulk Media Downloader</title>
    <meta
      name="description"
      content="XakuMedia is a local-first Windows desktop bulk media downloader with stream-level precision, multi-worker queue management, lossless FFmpeg merging, and zero cloud tracking."
    />
    <link rel="icon" href="/XakuMedia.ico" sizes="any" />
    <meta name="theme-color" content="#0b0c10" />

    <!-- Initial theme resolution (runs before first paint to avoid a flash):
         1. A saved choice from a previous visit always wins.
         2. The Electron desktop shell is authored dark.
         3. Otherwise follow the visitor's OS preference. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("xakumedia_theme");
          var dark;
          if (saved === "light" || saved === "dark") {
            dark = saved === "dark";
          } else if (window.api) {
            dark = true;
          } else {
            dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          }
          var root = document.documentElement;
          root.classList.toggle("dark", dark);
          root.classList.toggle("light", !dark);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute("content", dark ? "#0b0c10" : "#ffffff");
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="XakuMedia — Windows Bulk Media Downloader" />
    <meta
      property="og:description"
      content="Local-first desktop application with stream-level precision, multi-worker queue, and lossless FFmpeg merging. Zero cloud telemetry."
    />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="XakuMedia — Windows Bulk Media Downloader" />
    <meta
      name="twitter:description"
      content="Local-first desktop application with stream-level precision, multi-worker queue, and lossless FFmpeg merging. Zero cloud telemetry."
    />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
