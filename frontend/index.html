<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XakuMedia — Local-First Windows Desktop Bulk Media Downloader</title>
    <meta
      name="description"
      content="XakuMedia is a local-first Windows desktop bulk media downloader: scan profiles, channels, galleries, and direct links into one selectable gallery, then batch-download with lossless FFmpeg merging and zero cloud tracking."
    />
    <link rel="icon" href="/XakuMedia.ico" sizes="any" />
    <meta name="theme-color" content="#0b0c10" />

    <!-- Initial theme resolution (runs before first paint to avoid a flash;
         kept in a same-origin file so production `script-src 'self'` allows it). -->
    <script src="./theme-init.js"></script>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="XakuMedia — Windows Bulk Media Downloader" />
    <meta
      property="og:description"
      content="Bulk-scan profiles, channels, and galleries into one selectable grid, then download only what's new — local-first, with lossless FFmpeg merging and zero telemetry."
    />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="XakuMedia — Windows Bulk Media Downloader" />
    <meta
      name="twitter:description"
      content="Bulk-scan profiles, channels, and galleries into one selectable grid, then download only what's new — local-first, with lossless FFmpeg merging and zero telemetry."
    />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
